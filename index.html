<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Tarefas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    padding:40px;
}

.container{
    width:700px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.nova-tarefa{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
}

button{
    padding:10px 15px;
    cursor:pointer;
}

.filtros{
    margin-top:15px;
    display:flex;
    gap:10px;
}

ul{
    list-style:none;
    margin-top:20px;
}

li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    margin-bottom:10px;
    background:#f0f0f0;
    border-radius:5px;
}

.concluida{
    text-decoration:line-through;
    color:gray;
}

.acoes{
    display:flex;
    gap:5px;
}
</style>

</head>
<body>

<div class="container">

    <h1>Gerenciador de Tarefas</h1>

    <div class="nova-tarefa">
        <input type="text" id="tarefaInput" placeholder="Digite uma tarefa">
        <button onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <div class="filtros">
        <button onclick="filtrarTarefas('todas')">Todas</button>
        <button onclick="filtrarTarefas('pendentes')">Pendentes</button>
        <button onclick="filtrarTarefas('concluidas')">Concluídas</button>
    </div>

    <ul id="listaTarefas"></ul>

</div>

<script>

let tarefas = JSON.parse(localStorage.getItem("tarefas")) || [];

function salvarTarefas() {
    localStorage.setItem("tarefas", JSON.stringify(tarefas));
}

function adicionarTarefa() {

    const input = document.getElementById("tarefaInput");
    const texto = input.value.trim();

    if(texto === "") {
        alert("Digite uma tarefa.");
        return;
    }

    tarefas.push({
        id: Date.now(),
        texto: texto,
        concluida: false
    });

    salvarTarefas();
    input.value = "";
    renderizarTarefas();
}

function concluirTarefa(id){

    tarefas = tarefas.map(tarefa => {

        if(tarefa.id === id){
            tarefa.concluida = !tarefa.concluida;
        }

        return tarefa;
    });

    salvarTarefas();
    renderizarTarefas();
}

function excluirTarefa(id){

    tarefas = tarefas.filter(
        tarefa => tarefa.id !== id
    );

    salvarTarefas();
    renderizarTarefas();
}

function editarTarefa(id){

    const novoTexto = prompt("Editar tarefa:");

    if(!novoTexto) return;

    tarefas = tarefas.map(tarefa => {

        if(tarefa.id === id){
            tarefa.texto = novoTexto;
        }

        return tarefa;
    });

    salvarTarefas();
    renderizarTarefas();
}

function renderizarTarefas(lista = tarefas){

    const ul = document.getElementById("listaTarefas");
    ul.innerHTML = "";

    lista.forEach(tarefa => {

        ul.innerHTML += `
            <li class="${tarefa.concluida ? 'concluida' : ''}">
                ${tarefa.texto}

                <div class="acoes">

                    <button onclick="concluirTarefa(${tarefa.id})">
                        ✓
                    </button>

                    <button onclick="editarTarefa(${tarefa.id})">
                        Editar
                    </button>

                    <button onclick="excluirTarefa(${tarefa.id})">
                        Excluir
                    </button>

                </div>
            </li>
        `;
    });
}

function filtrarTarefas(tipo){

    if(tipo === "todas"){
        renderizarTarefas(tarefas);
    }

    if(tipo === "pendentes"){
        renderizarTarefas(
            tarefas.filter(t => !t.concluida)
        );
    }

    if(tipo === "concluidas"){
        renderizarTarefas(
            tarefas.filter(t => t.concluida)
        );
    }
}

renderizarTarefas();

</script>

</body>
</html>
